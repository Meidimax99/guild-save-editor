[package]
name = "guild-save-edit"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.9", features = ["derive"] }
eframe = "0.37.0"
egui_extras = "0.37"
encoding_rs = "0.8.44"
flate2 = "1.1.11"
glam = { version = "0.34.3", features = ["serde"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
